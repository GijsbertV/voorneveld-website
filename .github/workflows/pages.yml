name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job with one retry: right after the upload, GitHub sometimes
  # cannot find the artifact yet.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
